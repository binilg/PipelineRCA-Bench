id: s007
title: Backfill run with the wrong --days value re-wrote three days that were already finalized
category: rerun_idempotency_failure
difficulty: medium
stack: [airflow, python, pandas]

symptom: |
  No pipeline task failed and no alert fired. Finance flags that the
  weekly sales-vs-forecast rollup report for the week of 2026-07-27
  (Mon) through 2026-08-02 (Sun) -- computed by the scheduled rollup
  job on Monday 2026-08-03 -- doesn't match the current forecast
  partitions when they recomputed it on 2026-08-06. The rollup and the
  current partitions disagree for 3 of the 7 days.

  Identify why the rollup and the underlying partitions no longer agree.

context_files:
  - context/backfill_cli.py
  - context/backfill_run_log.txt
  - context/on_call_notes.txt
  - context/weekly_rollup_job.py
  - context/rollup_report_comparison.csv
  - context/row_counts.csv
  - context/git_log.txt

ground_truth:
  root_cause: |
    On 2026-08-04 an upstream vendor delivered corrected store
    transactions for 2026-07-26, so an engineer needed to backfill that
    single day. They ran the backfill CLI with
    `--start-date 2026-07-26 --days 4`, believing `--days` set a 4-day
    lookback so the pipeline's 4-day rolling-window features would be
    covered (see on_call_notes.txt). In fact `--days` is the number of
    sequential run_dates to reprocess starting from --start-date, so the
    backfill reprocessed and overwrote 2026-07-26 through 2026-07-29 --
    not just the intended day.

    2026-07-27 through 2026-07-29 belong to the week of 2026-07-27,
    whose rollup had already run on Monday 2026-08-03. Reprocessing
    re-reads inputs as they exist at backfill time, so those three
    partitions were overwritten with values that differ from the ones
    the rollup had consumed. Following the runbook, the engineer re-ran
    only the rollup for the week containing the date they meant to
    change (week of 2026-07-20, which contains 07-26). Nothing re-ran
    the week-of-07-27 rollup, and the rollup job does not track which
    partition versions it consumed. That report is therefore silently
    stale for exactly 3 of its 7 days (07-27, 07-28, 07-29), with no
    task failure or alert anywhere.

  causal_chain:
    - corrected vendor input for 2026-07-26 arrives on 2026-08-04, requiring a backfill of that single day
    - the engineer runs the backfill CLI with --start-date 2026-07-26 --days 4, believing --days sets a 4-day feature lookback, not realizing it means "reprocess this many sequential run_dates"
    - the backfill reprocesses and overwrites partitions for 07-26, 07-27, 07-28, and 07-29
    - 07-27 through 07-29 had already been aggregated into the week-of-07-27 rollup on 2026-08-03, and reprocessing them produced different values because it re-reads inputs as of backfill time
    - the engineer re-runs only the prior week's (week of 07-20) rollup per the runbook, since only 07-26 was meant to change; the week-of-07-27 rollup is never re-triggered
    - the week-of-07-27 rollup is now silently stale relative to the current partitions for 3 of its 7 days (07-27 to 07-29), with no task failure to flag it

  # Plausible-but-wrong causes present in the context.
  distractors:
    - git_log.txt shows a commit fixing a number-formatting bug in the weekly rollup report the same week -- it touches the rollup, but only formatting, and was merged before the 2026-08-03 rollup ran
    - row_counts.csv shows identical row counts before and after the backfill for every reprocessed day -- true (partitions were cleanly overwritten), and easy to read as "nothing changed" when only the values feeding the rollup changed
    - backfill_run_log.txt and on_call_notes.txt show the engineer did re-run a weekly rollup after the backfill -- easy to conclude the rollups were refreshed, but it was only the prior week's (week of 07-20), not the week of 07-27
    - git_log.txt shows the --days argument was added to backfill_cli.py only recently (2026-07-15) -- tempting to call it a buggy new feature, but the flag does exactly what its docstring says; the problem is how it was used and that nothing downstream reacted

  acceptable_fixes:
    - description: |
        Fix backfill_cli.py so --days cannot silently reprocess dates
        beyond what was requested -- rename/clarify the parameter,
        default to reprocessing only the single specified date unless
        a range is explicitly given, and require explicit confirmation
        when a backfill touches a date range wider than one day.
    - description: |
        Make the weekly rollup dependency-aware -- automatically
        invalidate and re-trigger every downstream rollup whose input
        partitions get overwritten or backfilled (here, both the week of
        07-20 and the week of 07-27), instead of rollups being a
        one-time, fire-and-forget computation refreshed only by hand.
  partial_credit_fixes:
    - description: Add a warning/confirmation prompt in the backfill CLI whenever --days > 1, without resolving the underlying ambiguity or the rollup dependency
    - description: Manually re-run the week-of-07-27 rollup and update the runbook to re-run rollups for every week a backfill touches (procedural, relies on humans remembering)
  verification: verify/test_fix.py

# Anti-gaming: agent must name the mechanism, not just the symptom.
required_answer_elements:
  - identifies the --days 4 backfill reprocessing 07-26 through 07-29 (not just the intended 07-26) as the trigger
  - identifies that the week-of-07-27 rollup was not re-triggered after the backfill overwrote 07-27 to 07-29 (only the prior week's rollup was re-run) as the mechanism for the inconsistency
  - does not conclude this is a row-duplication issue like s002 -- partitions are cleanly overwritten, not appended; the bug is a stale downstream aggregate, not duplicate data
